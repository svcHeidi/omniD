# Copy this file to a user-local path and set:
#   export OMNIDRIVER_RUNTIME_CONFIG=/absolute/path/omnidriver-runtime.yaml
#
# This file is machine configuration, not case/sweep configuration. It is
# selected once for all omnidriver runs on this host.
#
# Native ./Allwmake reads none of these variables -- it is a separate build
# step, unaffected by this runtime selection.
openfoam:
  bashrc: /Volumes/OpenFOAM-v2412/etc/bashrc

plugins:
  org.cardiacfoam:
    # Valid values are declared in the plugin's plugin.yaml.
    backend: full
    solids4foam_root: /absolute/path/to/solids4foam
    build_manifest: /absolute/path/to/OpenFOAM/user/lib/cardiacFoam.build.json
