[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnidriver-torchcor"
version = "0.1.0"
description = "TorchCor cardiac electrophysiology plugin for OmniD, driven through a solver repository's case.json runner."
requires-python = ">=3.11"
dependencies = ["omnidriver~=0.1.0"]

[project.entry-points."omnidriver.plugins"]
torchcor = "omnidriver.torchcor.plugin:TorchCorPlugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"omnidriver.torchcor" = ["torchcor.yaml", "guidance.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--import-mode=importlib"
