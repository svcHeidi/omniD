schema_version: 1
plugin:
  id: org.driverfoam.generic-openfoam
  api_version: "2"
case_profile:
  dictionaries:
    - path: system/controlDict
      kind: openfoam_dictionary
      role: openfoam.control_dict
      required: always
    - path: constant
      kind: openfoam_dictionary
      role: openfoam.case_directory
      required: always
    - path: Allrun
      kind: case_script
      role: openfoam.entrypoint
      required: conditional
