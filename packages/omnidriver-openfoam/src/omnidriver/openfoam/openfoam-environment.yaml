schema_version: 1
plugin:
  id: org.omnidriver.openfoam.environment
  api_version: "2"
# A capability is declared here only if every member it adapts is a real,
# non-stub method on this class -- check_provides() (provider_stack.py)
# enforces that at driver_context() construction, per provider, before
# composition runs.
#
# Not declared, though implemented_capabilities() reports them with stubs
# still present: command_authorization (only get_environment_commands /
# is_installed_environment_command are real here), case_introspection,
# run_document_configuration. Not implemented at all: case_files,
# mesh_diagnostic_policy -- those are solver-specific and cardiacFoam is the
# only current implementer.
#
# get_dict_key_scanner returns dict_keys_scanner.catalog_report
# unconditionally: a real scanner, not a stub.
#
# `provides:` is a realness declaration only -- resolutions()
# (provider_stack.py) picks each capability's winner purely by which
# provider has a callable member, never by consulting this list. A
# capability withheld here for realness can still win resolutions() if this
# provider is the most-specific implementer. See ARCHITECTURE.md's
# "Provider composition" section.
provides:
  - case_runtime_conventions
  - environment_preflight
  - dict_diagnostics
  - effective_configuration
  - config_value
  - dict_key_scanner
  # get_case_value_comparator returns `_case_value_agree`, a real typed
  # comparison delegating to `literals.values_agree` -- not a stub.
  - case_value_comparison
case_profile:
  dictionaries:
    - path: system/controlDict
      kind: openfoam_dictionary
      role: openfoam.control_dict
      required: always
    - path: constant
      kind: openfoam_dictionary
      role: openfoam.case_directory
      required: always
    - path: Allrun
      kind: case_script
      role: openfoam.entrypoint
      required: conditional
# The shell every OpenFOAM-based stack (cardiacFOAM, cardiacCore) runs in,
# declared once here (one reality). `omnidriver env --plugin P` renders and
# checks it; nothing is searched for.
environment:
  supplied:
    - name: OPENFOAM_BASHRC
      required: true
      why: OpenFOAM's etc/bashrc, sourced first. It puts OpenFOAM's own MPI first on PATH, so no other solver's MPI bin may be added to this shell
    - name: DYLD_LIBRARY_PATH
      required: false
      why: macOS only. Exported after the source, because macOS strips DYLD_* when bash starts
  source: OPENFOAM_BASHRC
  mpi_launcher: mpirun
