schema_version: 1
plugin:
  id: org.omnidriver.openfoam.environment
  api_version: "2"
case_profile:
  dictionaries:
    - path: system/controlDict
      kind: openfoam_dictionary
      role: openfoam.control_dict
      required: always
    - path: constant
      kind: openfoam_dictionary
      role: openfoam.case_directory
      required: always
    - path: Allrun
      kind: case_script
      role: openfoam.entrypoint
      required: conditional
# The shell every OpenFOAM-based stack (cardiacFOAM, cardiacCore) runs in,
# declared once here (one reality). `omnidriver env --plugin P` renders and
# checks it; nothing is searched for.
environment:
  supplied:
    - name: OPENFOAM_BASHRC
      required: true
      why: OpenFOAM's etc/bashrc, sourced first. It puts OpenFOAM's own MPI first on PATH, so no other solver's MPI bin may be added to this shell
    - name: DYLD_LIBRARY_PATH
      required: false
      why: macOS only. Exported after the source, because macOS strips DYLD_* when bash starts
  source: OPENFOAM_BASHRC
  mpi_launcher: mpirun
