[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnidriver-cardiaccore"
version = "0.1.0"
description = "Source-backed cardiacCore preprocessing plugin for OmniD cases."
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "omnidriver>=0.1.0", "omnidriver-openfoam>=0.1.0"]

[project.optional-dependencies]
# Native seed/coverage and encoded VTU readers use this; array methods do not.
vtk = ["pyvista"]

[project.entry-points."omnidriver.plugins"]
cardiaccore = "omnidriver.cardiaccore.plugin:CardiacCorePlugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"omnidriver.cardiaccore" = ["plugin.yaml", "agent_guidance/*.md", "agent_guidance/*.yaml"]

[tool.pytest.ini_options]
# Duplicated from the root pyproject.toml on purpose: a per-package run
# resolves this file, a whole-repo run resolves the root's.
markers = [
    "native_cardiaccore: needs OMNIDRIVER_CARDIACCORE_TREE and OMNIDRIVER_CARDIACCORE_ANATOMY; fails (not skips) if unset",
]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--import-mode=importlib"
