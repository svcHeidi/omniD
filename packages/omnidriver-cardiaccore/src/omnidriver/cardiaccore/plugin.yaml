schema_version: 1
plugin:
  id: org.omnidriver.cardiaccore
  api_version: "2"
requires:
  - org.omnidriver.openfoam.environment
# provides: lists only capabilities this provider genuinely answers, judged
# two ways -- neither alone is enough:
#
# 1. Presence: a callable member exists for the capability.
#
# 2. Realness: the member's body actually computes something rather than
#    unconditionally ignoring its arguments and returning a constant.
#    provider_stack.implemented_capabilities() only checks callability, so
#    passing gate 1 does not imply gate 2 -- read every adapted member's
#    actual body. One hollow member disqualifies the whole capability, the
#    same standard applied to org.omnidriver.openfoam.environment's
#    provides: (see its plugin.yaml).
#
# Withheld for realness:
#   - artifacts: predict_data_artifacts unconditionally returns `()`.
#   - run_semantic_validator: validate_run_semantics unconditionally
#     returns `()`.
#   - runtime_evidence: all four adapted members (get_artifact_value_reader,
#     get_extra_provenance_paths, get_solve_step_commands,
#     get_telemetry_source_globs) ignore their arguments and return a fixed
#     empty/`None` value.
#
# run_document_configuration is genuinely implemented: a per-tutorial
# $CARDIAC_CONDUCTIVITY/... schema, not a stub.
#
# configuration_validator's validate_configuration is also genuinely
# implemented, wired to workflows/run_config.validate_configuration: it
# checks the spec's own workflow-relevant catalog entries against the
# resolved case at plan time (required / enum / co_required_with /
# mutually_exclusive_with), by composing this provider with the OpenFOAM
# environment adapter it requires and reusing core's validate_run, and it
# exempts a generic case_folder run (spec.metadata["generic_case"]). It is
# still not declared in provides: below -- undeclared-but-real is a
# different gap than hollowness, and the realness standard above does not
# settle it.
#
# Realness governs check_provides(); it does not reach resolutions()
# (provider_stack.py), which picks each capability's winner purely by
# callable presence and never consults provides: at all. A capability
# withheld here for realness can still win resolutions() if this provider is
# the most-specific implementer. See ARCHITECTURE.md's "Provider
# composition" > "provides: / requires:" section for the full explanation;
# changing resolutions() would change every capability_digest this codebase
# has ever computed, so this is not fixed there or here.
provides:
  - dictionaries
  - named_catalogs
  - cxx_mapping
  - manifest
  - run_document_configuration
  # get_record_key_validator is the sole member adapting
  # record_key_validation; it answers for every document a cardiacCore stack
  # might see (record_key_validation.record_key_validator's own module
  # docstring states the three rules), never a stub -- the same standard
  # cardiacFOAM's own plugin.yaml applies to its own record_key_validation
  # entry.
  - record_key_validation
# The C++ source the key scanner reads (one mechanism with cardiacFOAM's,
# omnidriver-openfoam's dict_keys_scanner): supplied, never discovered. The
# variable is the native cardiacCore tree the native suite already takes;
# `relative` is that repository's own layout. Every strict plan compares the
# catalog (catalogs/inputs.py) with it.
cxx_mapping:
  source_root:
    variable: OMNIDRIVER_CARDIACCORE_TREE
    relative: src
  reviewed_allowlist: dict_key_allowlist.json
case_profile:
  dictionaries:
    - path: system/setCardiacConductivityDict
      kind: openfoam_dictionary
      role: cardiaccore.conductivity_dictionary
      required: conditional
    - path: system/setCardiacAnatomyDict
      kind: openfoam_dictionary
      role: cardiaccore.anatomy_dictionary
      required: conditional
    - path: system/setPurkinjeSlabDict
      kind: openfoam_dictionary
      role: cardiaccore.purkinje_slab_dictionary
      required: conditional
    - path: system/setPurkinjeMorphometryDict
      kind: openfoam_dictionary
      role: cardiaccore.purkinje_morphometry_dictionary
      required: conditional
    - path: system/setCardiacScarDict
      kind: openfoam_dictionary
      role: cardiaccore.scar_dictionary
      required: conditional
    - path: system/setPurkinjeScarDict
      kind: openfoam_dictionary
      role: cardiaccore.purkinje_scar_dictionary
      required: conditional
    - path: system/coordinatesConventionDict
      kind: openfoam_dictionary
      role: cardiaccore.coordinates_convention_dictionary
      required: conditional
    - path: system/generatePurkinjeTreeDict
      kind: openfoam_dictionary
      role: cardiaccore.purkinje_tree_dictionary
      required: conditional
