name = "setCardiacConductivity"
description = "Build orthotropic conductivity tensors from fiber and sheet fields."
category = "field-setup"

purpose = "Declared from cardiacCore's native bivCase wrapper and utility documentation."
inputs = [
  "system/setCardiacConductivityDict",
  "0/fiber",
  "0/sheet",
]
requires_mesh = true
example = "setCardiacConductivity -case <case>"

[[produces]]
artifact_id = "conductivity"
path_pattern = "0/Conductivity"
format = "openfoam_field"
description = "Conductivity tensor"
produced_by = "setCardiacConductivity"

[[produces]]
artifact_id = "conductivity_intracellular"
path_pattern = "0/ConductivityIntracellular"
format = "openfoam_field"
description = "Optional intracellular tensor"
produced_by = "setCardiacConductivity"
optional = true

[[produces]]
artifact_id = "conductivity_extracellular"
path_pattern = "0/ConductivityExtracellular"
format = "openfoam_field"
description = "Optional extracellular tensor"
produced_by = "setCardiacConductivity"
optional = true
