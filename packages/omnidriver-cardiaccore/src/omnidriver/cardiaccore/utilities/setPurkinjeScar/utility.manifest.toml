name = "setPurkinjeScar"
description = "Map myocardial scar severity and region fields onto a Purkinje graph."
category = "field-setup"

purpose = """\
Reads system/setPurkinjeScarDict, current-time severity and region fields, and a graph \
dictionary from constant/. It updates each graph edge's conductance from endpoint scar \
severity and adds PVJ resistances, writing constant/<outputGraph>. Without \
outputGraph, the native default is <inputGraph>Scar."""
inputs = [
  "system/setPurkinjeScarDict",
  "<current-time>/<severityField named by system/setPurkinjeScarDict>",
  "<current-time>/<regionField named by system/setPurkinjeScarDict>",
  "constant/<inputGraph named by system/setPurkinjeScarDict>",
]
requires_mesh = true
example = "setPurkinjeScar -case ."

[[produces]]
artifact_id = "scar_coupled_purkinje_graph"
path_pattern = "constant/<outputGraph>"
format = "openfoam_dict"
description = "Purkinje graph with scar-adjusted conductionEdges and pvjResistances; defaults to <inputGraph>Scar."
produced_by = "setPurkinjeScar"
