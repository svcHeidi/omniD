name = "setPurkinjeMorphometry"
description = "Classify each ventricular cell into Purkinje morphometry regions and write its terminal weights."
category = "field-setup"

purpose = "Declared from cardiacCore's native tutorial wrappers and utility documentation."
inputs = [
  "system/setPurkinjeMorphometryDict",
  "system/coordinatesConventionDict",
  "0/AHA_Segment",
  "0/aha_angle",
  "0/aha_z",
]
requires_mesh = true
example = "setPurkinjeMorphometry -case <case>"

[[produces]]
artifact_id = "purkinje_longitudinal_region"
path_pattern = "0/PurkinjeLongitudinalRegion"
format = "openfoam_field"
description = "Longitudinal region labels"
produced_by = "setPurkinjeMorphometry"

[[produces]]
artifact_id = "purkinje_circumferential_region"
path_pattern = "0/PurkinjeCircumferentialRegion"
format = "openfoam_field"
description = "Circumferential region labels"
produced_by = "setPurkinjeMorphometry"

[[produces]]
artifact_id = "purkinje_morphometry_segment"
path_pattern = "0/PurkinjeMorphometrySegment"
format = "openfoam_field"
description = "Morphometry segment per cell, named in src/purkinjeMorphometry/purkinje_morphometry_segment_names.json"
produced_by = "setPurkinjeMorphometry"

[[produces]]
artifact_id = "purkinje_terminal_weight_subendocardial"
path_pattern = "0/PurkinjeTerminalWeightSubendocardial"
format = "openfoam_field"
description = "Sub-endocardial terminal weights"
produced_by = "setPurkinjeMorphometry"

[[produces]]
artifact_id = "purkinje_terminal_weight_intramural"
path_pattern = "0/PurkinjeTerminalWeightIntramural"
format = "openfoam_field"
description = "Intramural terminal weights"
produced_by = "setPurkinjeMorphometry"
