name = "setPurkinjeSlab"
description = "Mark the sub-endocardial Purkinje slab and scale conductivity there."
category = "field-setup"

purpose = "Declared from cardiacSubstrateFOAM's native tutorial wrappers and utility documentation."
inputs = [
  "system/setPurkinjeSlabDict",
  "0/transmural",
  "0/Conductivity",
]
requires_mesh = true
example = "setPurkinjeSlab -case <case>"

[[produces]]
artifact_id = "purkinje_layer"
path_pattern = "0/PurkinjeLayer"
format = "openfoam_field"
description = "Purkinje slab mask"
produced_by = "setPurkinjeSlab"

[[produces]]
artifact_id = "conductivity"
path_pattern = "0/Conductivity"
format = "openfoam_field"
description = "Conductivity tensor updated in the Purkinje slab"
produced_by = "setPurkinjeSlab"

[[produces]]
artifact_id = "conductivity_intracellular"
path_pattern = "0/ConductivityIntracellular"
format = "openfoam_field"
description = "Intracellular tensor updated in the Purkinje slab, when the case has one"
produced_by = "setPurkinjeSlab"
optional = true

[[produces]]
artifact_id = "conductivity_extracellular"
path_pattern = "0/ConductivityExtracellular"
format = "openfoam_field"
description = "Extracellular tensor updated in the Purkinje slab, when the case has one"
produced_by = "setPurkinjeSlab"
optional = true
