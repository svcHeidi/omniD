schema_version: 1
plugin:
  id: org.cardiacfoam
  api_version: "3"
requires:
  - org.omnidriver.openfoam.environment
runtime:
  openfoam:
    bashrc_env: OPENFOAM_BASHRC
  backend:
    required: true
    selection_env: OMNIDRIVER_CARDIACFOAM_BACKEND
    common_libraries:
      - libelectroModels
      - libionicModels
      - libgenericWriter
      - libactiveTensionModels
    options:
      lightweight:
        build_define: USE_LIGHTWEIGHT_PHYSICSMODEL=1
        required_libraries:
          - libphysicsModel
        forbidden_libraries:
          - libsolids4FoamModels
          - libelectroMechanicalModels
      full:
        build_define: USE_LIGHTWEIGHT_PHYSICSMODEL=0
        required_source: solids4foam
        required_libraries:
          - libsolids4FoamModels
          - libelectroMechanicalModels
        forbidden_libraries:
          - libphysicsModel
case_profile:
  dictionaries:
    - path: constant/electroProperties
      kind: openfoam_dictionary
      role: plugin.configuration
      required: always
    - path: constant/physicsProperties
      kind: openfoam_dictionary
      role: plugin.configuration
      required: always
    - path: constant/prePacingProperties
      kind: openfoam_dictionary
      role: plugin.configuration
      required: conditional
# The C++ source the key scanner reads: supplied, never discovered. The
# variable is the native tutorials tree; `relative` is the native repository's
# own layout (src/ beside tutorials/).
cxx_mapping:
  source_root:
    variable: OMNIDRIVER_NATIVE_TUTORIALS
    relative: ../src
  reviewed_allowlist: dict_key_allowlist.json
