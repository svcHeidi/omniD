schema_version: 1
plugin:
  id: org.cardiacfoam
  api_version: "2"
requires:
  - org.omnidriver.openfoam.environment
runtime:
  openfoam:
    bashrc_env: OPENFOAM_BASHRC
  backend:
    required: true
    selection_env: OMNIDRIVER_CARDIACFOAM_BACKEND
    common_libraries:
      - libelectroModels
      - libionicModels
      - libgenericWriter
      - libactiveTensionModels
    options:
      lightweight:
        build_define: USE_LIGHTWEIGHT_PHYSICSMODEL=1
        required_libraries:
          - libphysicsModel
        forbidden_libraries:
          - libsolids4FoamModels
          - libelectroMechanicalModels
      full:
        build_define: USE_LIGHTWEIGHT_PHYSICSMODEL=0
        required_source: solids4foam
        required_libraries:
          - libsolids4FoamModels
          - libelectroMechanicalModels
        forbidden_libraries:
          - libphysicsModel
case_profile:
  dictionaries:
    - path: system/fvSchemes
      kind: openfoam_dictionary
      role: openfoam.discretisation
      required: always
    - path: system/fvSolution
      kind: openfoam_dictionary
      role: openfoam.solver_settings
      required: always
    - path: constant/electroProperties
      kind: openfoam_dictionary
      role: plugin.configuration
      required: always
    - path: constant/physicsProperties
      kind: openfoam_dictionary
      role: plugin.configuration
      required: always
    - path: system/decomposeParDict
      kind: openfoam_dictionary
      role: openfoam.decomposition
      required: conditional
    - path: system/blockMeshDict
      kind: openfoam_dictionary
      role: openfoam.mesh_generation
      required: conditional
    - path: Allclean
      kind: case_script
      role: openfoam.cleanup
      required: conditional
    - path: README.md
      kind: documentation
      role: case.documentation
      required: conditional
    - path: regression/regressionTest.sh
      kind: case_script
      role: case.regression_test
      required: conditional
# The C++ source the key scanner reads: supplied, never discovered. The
# variable is the native tutorials tree; `relative` is the native repository's
# own layout (src/ beside tutorials/).
cxx_mapping:
  source_root:
    variable: OMNIDRIVER_NATIVE_TUTORIALS
    relative: ../src
  reviewed_allowlist: dict_key_allowlist.json
