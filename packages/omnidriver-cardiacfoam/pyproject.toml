[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnidriver-cardiacfoam"
version = "0.1.0"
description = "cardiacFoam electrophysiology domain plugin for omnidriver."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Simao Nieto de Castro, UCD" }]
dependencies = [
  "omnidriver~=0.1.0",
  "omnidriver-openfoam~=0.1.0",
  "numpy>=1.24",
]

[project.entry-points."omnidriver.plugins"]
cardiacfoam = "omnidriver.cardiacfoam.cardiacfoam_plugin:CardiacFoamPlugin"

[project.optional-dependencies]
post = [
  "matplotlib>=3.7",
  "pandas>=2.0",
  "plotly>=5.0",
  "prompt-toolkit>=3.0",
  "openpyxl>=3.1",
]

[tool.pytest.ini_options]
# Duplicated from the root pyproject.toml on purpose: pytest resolves one
# config per run, so a per-package run reads this file and a whole-repo run
# reads the root. A marker registered in only one place warns in the other.
markers = [
    "integration: tests requiring a real cardiacFoam binary (skipped by default in CI)",
]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--import-mode=importlib"

[tool.setuptools.packages.find]
where = ["src"]
include = ["omnidriver*"]

[tool.setuptools.package-data]
"omnidriver.cardiacfoam" = [
    "plugin.yaml",
    "dict_key_allowlist.json",
    "fixtures/template/constant/*",
    "utilities/*/utility.manifest.toml",
]
