schema_version: 1
plugin:
  id: org.driverfoam.generic-openfoam  # Reverse-DNS id; must match plugin_id property
  api_version: "2"                      # "1" or "2"; "2" is required for sweep support

# case_profile.dictionaries lists the files driverFOAM will track for this plugin.
# Each entry describes one file relative to the case root.
#
# Field reference:
#   path      (required) - path relative to the case root.
#   kind      (required) - one of:
#               openfoam_dictionary  : standard OpenFOAM keyword-value file
#               case_script          : shell script (Allrun, Allclean, ...)
#               documentation        : human-readable file (README.md, ...)
#   role      (required) - semantic role tag. VALIDATED at load time against
#                          core.plugin_profile.KNOWN_ROLES -- an unlisted role
#                          is an error, not a warning, UNLESS it uses the
#                          escape tier documented below. The closed set:
#               openfoam.control_dict       : system/controlDict
#               openfoam.discretisation     : system/fvSchemes
#               openfoam.solver_settings    : system/fvSolution
#               openfoam.decomposition      : system/decomposeParDict
#               openfoam.mesh_generation    : system/blockMeshDict
#               openfoam.case_directory     : a top-level OpenFOAM case
#                                             directory (system, constant)
#                                             present regardless of solver --
#                                             core derives which top-level
#                                             directories to walk for
#                                             provenance from these entries,
#                                             not from a hardcoded list
#               openfoam.entrypoint         : Allrun
#               openfoam.cleanup            : Allclean
#               plugin.configuration        : solver-specific constant/* file
#               case.documentation          : README.md
#               case.regression_test        : runRegressionTest.sh
#
#             This set is OpenFOAM's vocabulary and stays closed -- a typo
#             against it (wrong case, wrong word, missing the namespace
#             entirely) is a load-time ValueError, not a silent
#             misclassification. It is NOT the vocabulary for a plugin
#             whose environment is not OpenFOAM at all (FEniCS, deal.II,
#             SU2, ...). That plugin instead uses the escape tier: a role
#             of the exact shape "x-<namespace>.<leaf>", e.g.
#             "x-fenics.mesh_file". Core does not and will not validate
#             <namespace> or <leaf> spelling for an escaped role -- it has
#             no vocabulary for a foreign environment to validate against.
#             The "x-" marker may not be followed by one of the three
#             reserved words above (so "x-openfoam.foo" is still rejected);
#             that keeps the escape hatch from being used to dodge the
#             closed-enum check on a role that looks like it should be
#             OpenFOAM's. See future/ENVIRONMENT_CONTRACT.md §10.
#   required  (required) - one of:
#               always       : the driver expects this file at plan time
#               conditional  : optional; driver skips checks if file is absent
case_profile:
  dictionaries:
    # These two are true of every OpenFOAM case regardless of solver -- not
    # "plugin-owned" in the solver-specific sense. A real plugin adds its own
    # constant/* files with role plugin.configuration; see
    # plugins/cardiacfoam/plugin.yaml for a full example.
    - path: system/controlDict
      kind: openfoam_dictionary
      role: openfoam.control_dict
      required: always
    - path: constant
      kind: openfoam_dictionary
      role: openfoam.case_directory
      required: always
    - path: Allrun
      kind: case_script
      role: openfoam.entrypoint
      required: conditional

# cxx_mapping is OPTIONAL.
# Include it only if your plugin has C++ source files whose dict keys should
# be audited against a reviewed allowlist (dict_key_allowlist.json).
#
# cxx_mapping:
#   source_roots:
#     - path/to/your/src          # relative to this yaml file's directory
#   reviewed_allowlist: dict_key_allowlist.json  # auto-generated; commit & keep CI green
