[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnidriver"
version = "0.1.0"
description = "Solver-agnostic scientific workflow orchestrator: DAG execution, provenance, schema validation."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Simao Nieto de Castro, UCD" }]
dependencies = [
  "jsonschema>=4.0",
  "PyYAML>=6.0",
]

# omnidriver.postprocessing renders tables and plots AFTER a run; core's
# plan/run/sweep-run path never imports it. Optional so a headless install
# stays light -- but the CI core job installs [post], because
# tests/core/test_table_writer.py exercises it and a test that silently skips
# proves nothing. This extra was lost in the migration from
# noFrontendCardiacFoam, which is why that test could not be collected.
[project.optional-dependencies]
post = [
  "matplotlib>=3.7",
  "pandas>=2.0",
  "plotly>=5.0",
]


[project.scripts]
omnidriver = "omnidriver.cli:main"

[project.entry-points."omnidriver.plugins"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--import-mode=importlib"

[tool.setuptools.packages.find]
where = ["src"]
include = ["omnidriver*"]

[tool.setuptools.package-data]
"omnidriver.core" = ["generic-plugin.yaml"]
"omnidriver.schemas" = ["run-document.json"]
