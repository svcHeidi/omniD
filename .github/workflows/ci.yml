name: CI

on:
  push:
    branches: [main]
  pull_request:

# NOTE: the three test jobs below install `pytest` explicitly -- each
# package's own dependencies don't include it, so omitting this step fails
# every "Run tests" step with `No module named pytest`.
jobs:
  test-core:
    name: test-core (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/omnidriver/pyproject.toml

      - name: Install omnidriver
        run: pip install -e "packages/omnidriver[post]" pytest

      - name: Run tests
        run: python -m pytest packages/omnidriver/tests -q

  test-openfoam:
    name: test-openfoam (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            packages/omnidriver/pyproject.toml
            packages/omnidriver-openfoam/pyproject.toml

      - name: Install omnidriver + omnidriver-openfoam
        run: pip install -e packages/omnidriver -e packages/omnidriver-openfoam pytest

      # `native` tests need OMNIDRIVER_NATIVE_TUTORIALS and FAIL (not skip)
      # when it is unset, which it always is here.
      - name: Run tests
        run: python -m pytest packages/omnidriver-openfoam/tests -m "not native" -q

      # This installs exactly one omnidriver.plugins adapter (openfoam-environment),
      # which default_driver_context() needs to resolve an implicit default --
      # test-core installs no adapter at all, and test-cardiac/test-cardiaccore
      # install two, so this is the only job where these two files' `_cli()`
      # calls (none pass --plugin) can resolve one.
      - name: Run core's plugin-dependent CLI/security regression tests
        run: |
          python -m pytest \
            packages/omnidriver/tests/core/test_trust_boundary_end_to_end.py \
            packages/omnidriver/tests/core/test_cli_run_document.py \
            -q

  test-cardiac:
    name: test-cardiac (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            packages/omnidriver/pyproject.toml
            packages/omnidriver-openfoam/pyproject.toml
            packages/omnidriver-cardiacfoam/pyproject.toml

      - name: Install omnidriver + omnidriver-openfoam + omnidriver-cardiacfoam
        run: |
          pip install -e packages/omnidriver \
                      -e packages/omnidriver-openfoam \
                      -e packages/omnidriver-cardiacfoam \
                      pytest

      # `native` tests need OMNIDRIVER_NATIVE_TUTORIALS and FAIL (not skip)
      # when it is unset, which it always is here.
      - name: Run tests
        run: python -m pytest packages/omnidriver-cardiacfoam/tests -m "not slow and not native" -q

  # Installs omnidriver-openfoam because omnidriver-cardiaccore genuinely
  # depends on it -- operations/ and workflows/ use
  # read_foam_entry/update_foam_entry -- which is the allowed direction: a
  # cardiac adapter may know OpenFOAM, not the reverse. That also means two
  # adapters are installed here, so this job is what would catch a
  # regression of the ambient-default-context defect in this package.
  test-cardiaccore:
    name: test-cardiaccore (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            packages/omnidriver/pyproject.toml
            packages/omnidriver-openfoam/pyproject.toml
            packages/omnidriver-cardiaccore/pyproject.toml

      - name: Install omnidriver + omnidriver-openfoam + omnidriver-cardiaccore
        run: |
          pip install -e packages/omnidriver \
                      -e packages/omnidriver-openfoam \
                      -e packages/omnidriver-cardiaccore \
                      pytest

      - name: Run tests
        run: python -m pytest packages/omnidriver-cardiaccore/tests -m "not native_cardiaccore" -q

  # openCARP drives a different binary entirely and needs no OpenFOAM, so this
  # job installs core and the opencarp adapter only -- which also proves the
  # package declares every dependency it uses. Its `native_opencarp` tests
  # need the openCARP binary and OMNIDRIVER_OPENCARP_TUTORIALS, and fail (not
  # skip) without them, so they are deselected here explicitly.
  test-opencarp:
    name: test-opencarp (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            packages/omnidriver/pyproject.toml
            packages/omnidriver-opencarp/pyproject.toml

      - name: Install omnidriver + omnidriver-opencarp
        run: |
          pip install -e packages/omnidriver \
                      -e packages/omnidriver-opencarp \
                      pytest

      - name: Run tests
        run: python -m pytest packages/omnidriver-opencarp/tests -m "not native_opencarp" -q

  test-all-package-wheels:
    name: test-all-package-wheels (py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            packages/omnidriver/pyproject.toml
            packages/omnidriver-openfoam/pyproject.toml
            packages/omnidriver-cardiacfoam/pyproject.toml
            packages/omnidriver-cardiaccore/pyproject.toml
            packages/omnidriver-opencarp/pyproject.toml

      - name: Install test collection dependencies
        run: |
          pip install -e packages/omnidriver \
                      -e packages/omnidriver-openfoam \
                      -e packages/omnidriver-cardiacfoam \
                      -e packages/omnidriver-cardiaccore \
                      -e packages/omnidriver-opencarp \
                      pytest

      - name: Build, install, and invoke all package wheels
        run: python -m pytest packages/omnidriver-cardiacfoam/tests/test_all_packages_wheel_install.py -q

  static-gates:
    name: static-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check core/openfoam/cardiac stay decoupled
        run: python3 scripts/check-import-boundaries.py

      - name: Check core names no OpenFOAM layout beyond its recorded, shrinking debt
        run: python3 scripts/check-core-shape.py

      - name: Check tutorial-record/axis modules write nothing
        run: python3 scripts/check-case-writes.py

      # The seam table in ARCHITECTURE.md is generated from the capability
      # Protocol docstrings. It went stale silently before this gate existed.
      - name: Install omnidriver (the generator imports it)
        run: pip install -e packages/omnidriver

      - name: Check benchmark references load and cite their sources
        run: python3 scripts/check-benchmark-references.py

      - name: Check ARCHITECTURE.md's capability-seam table is current
        run: python3 scripts/export-capability-seams.py --check

  test-wheel:
    name: test-wheel (core artifact, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Every other job installs editable, which leaves this repository on
      # sys.path -- so a module reading repo-relative state at import time
      # still works and the defect stays invisible. That bug shipped once
      # (capability_seams.py called repo_root_default() at module scope,
      # making it unimportable from a wheel while every test passed). This
      # job is the only one that tests what actually ships.
      - name: Build core sdist and wheel
        run: |
          pip install build
          python -m build --outdir dist packages/omnidriver

      - name: Install the built wheel into a clean environment
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install --upgrade pip
          /tmp/wheelenv/bin/pip install "$(ls dist/omnidriver-*.whl)[post]"

      - name: Verify the installed artifact runs standalone
        run: /tmp/wheelenv/bin/python scripts/check-wheel-artifact.py

      # The suite itself, against the wheel: the artifact gate above
      # deliberately does not import the test tree, so this is what actually
      # exercises the suite against an installed wheel rather than an
      # editable install.
      - name: Run core's suite against the installed wheel
        run: |
          /tmp/wheelenv/bin/pip install pytest
          /tmp/wheelenv/bin/python -m pytest packages/omnidriver/tests -q
