name: CI

on:
  push:
    branches: [main]
  pull_request:

# Each test job installs `pytest` explicitly: no package's own dependencies
# include it.
jobs:
  test-core:
    name: test-core (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/omnidriver/pyproject.toml

      - name: Install omnidriver
        run: pip install -e "packages/omnidriver[post]" pytest

      - name: Run tests
        run: python -m pytest packages/omnidriver/tests -q

  test-openfoam:
    name: test-openfoam (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            packages/omnidriver/pyproject.toml
            packages/omnidriver-openfoam/pyproject.toml

      - name: Install omnidriver + omnidriver-openfoam
        run: pip install -e packages/omnidriver -e packages/omnidriver-openfoam pytest

      - name: Run tests
        run: python -m pytest packages/omnidriver-openfoam/tests -q

  test-cardiac:
    name: test-cardiac (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            packages/omnidriver/pyproject.toml
            packages/omnidriver-openfoam/pyproject.toml
            packages/omnidriver-cardiacfoam/pyproject.toml

      - name: Install omnidriver + omnidriver-openfoam + omnidriver-cardiacfoam
        run: |
          pip install -e packages/omnidriver \
                      -e packages/omnidriver-openfoam \
                      -e packages/omnidriver-cardiacfoam \
                      pytest

      - name: Run tests
        run: python -m pytest packages/omnidriver-cardiacfoam/tests -m "not slow" -q

  # omnidriver-cardiacsubstrate depends on omnidriver-openfoam: its records, case
  # rules and key validation are built on the OpenFOAM layer.
  test-cardiacsubstrate:
    name: test-cardiacsubstrate (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            packages/omnidriver/pyproject.toml
            packages/omnidriver-openfoam/pyproject.toml
            packages/omnidriver-cardiacsubstrate/pyproject.toml

      - name: Install omnidriver + omnidriver-openfoam + omnidriver-cardiacsubstrate
        run: |
          pip install -e packages/omnidriver \
                      -e packages/omnidriver-openfoam \
                      -e packages/omnidriver-cardiacsubstrate \
                      pytest

      - name: Run tests
        run: python -m pytest packages/omnidriver-cardiacsubstrate/tests -q

  # openCARP drives a different binary entirely and needs no OpenFOAM, so this
  # job installs core and the opencarp adapter only -- which also proves the
  # package declares every dependency it uses.
  test-opencarp:
    name: test-opencarp (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            packages/omnidriver/pyproject.toml
            packages/omnidriver-opencarp/pyproject.toml

      - name: Install omnidriver + omnidriver-opencarp
        run: |
          pip install -e packages/omnidriver \
                      -e packages/omnidriver-opencarp \
                      pytest

      - name: Run tests
        run: python -m pytest packages/omnidriver-opencarp/tests -q

  test-agents:
    name: test-agents (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/omnidriver-agents/pyproject.toml

      - name: Install omnidriver-agents
        run: pip install -e packages/omnidriver-agents pytest

      - name: Run tests
        run: python -m pytest packages/omnidriver-agents/tests -q

  test-verifier:
    name: test-verifier (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            packages/omnidriver/pyproject.toml
            packages/omnidriver-verifier/pyproject.toml

      - name: Install omnidriver + omnidriver-verifier
        run: |
          pip install -e packages/omnidriver \
                      -e "packages/omnidriver-verifier[symbolic]" \
                      pytest

      - name: Run tests
        run: python -m pytest packages/omnidriver-verifier/tests -q

  # TorchCor runs in its own venv and is never installed here: the plugin's
  # tests read committed runner output, so this job installs core and the
  # torchcor adapter only.
  test-torchcor:
    name: test-torchcor (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            packages/omnidriver/pyproject.toml
            packages/omnidriver-torchcor/pyproject.toml

      - name: Install omnidriver + omnidriver-torchcor
        run: |
          pip install -e packages/omnidriver \
                      -e packages/omnidriver-torchcor \
                      pytest

      - name: Run tests
        run: python -m pytest packages/omnidriver-torchcor/tests -q

  test-all-package-wheels:
    name: test-all-package-wheels (py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            packages/omnidriver/pyproject.toml
            packages/omnidriver-openfoam/pyproject.toml
            packages/omnidriver-cardiacfoam/pyproject.toml
            packages/omnidriver-cardiacsubstrate/pyproject.toml
            packages/omnidriver-opencarp/pyproject.toml
            packages/omnidriver-torchcor/pyproject.toml

      - name: Install test collection dependencies
        run: |
          pip install -e packages/omnidriver \
                      -e packages/omnidriver-openfoam \
                      -e packages/omnidriver-cardiacfoam \
                      -e packages/omnidriver-cardiacsubstrate \
                      -e packages/omnidriver-opencarp \
                      -e packages/omnidriver-torchcor \
                      pytest

      - name: Build, install, and invoke all package wheels
        run: python -m pytest packages/omnidriver-cardiacfoam/tests/test_all_packages_wheel_install.py -q

  static-gates:
    name: static-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check core/openfoam/cardiac stay decoupled
        run: python3 scripts/check-import-boundaries.py

      - name: Check core names no OpenFOAM layout
        run: python3 scripts/check-core-shape.py

      - name: Check the OpenFOAM layer names no cardiac vocabulary
        run: python3 scripts/check-openfoam-shape.py

      - name: Check tutorial-record/axis modules write nothing
        run: python3 scripts/check-case-writes.py

      - name: Install omnidriver (the benchmark check imports it)
        run: pip install -e packages/omnidriver

      - name: Check benchmark references load and cite their sources
        run: python3 scripts/check-benchmark-references.py

  test-wheel:
    name: test-wheel (core artifact, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Every other job installs editable, which leaves this repository on
      # sys.path -- so a module reading repo-relative state at import time
      # still works and the defect stays invisible. This job is the only one
      # that tests what actually ships.
      - name: Build core sdist and wheel
        run: |
          pip install build
          python -m build --outdir dist packages/omnidriver

      - name: Install the built wheel into a clean environment
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install --upgrade pip
          /tmp/wheelenv/bin/pip install "$(ls dist/omnidriver-*.whl)[post]"

      - name: Verify the installed artifact runs standalone
        run: /tmp/wheelenv/bin/python scripts/check-wheel-artifact.py

      # The suite itself, against the wheel: the artifact gate above
      # deliberately does not import the test tree, so this is what actually
      # exercises the suite against an installed wheel rather than an
      # editable install.
      - name: Run core's suite against the installed wheel
        run: |
          /tmp/wheelenv/bin/pip install pytest
          /tmp/wheelenv/bin/python -m pytest packages/omnidriver/tests -q
