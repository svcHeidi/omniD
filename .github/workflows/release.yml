name: Release

on:
  push:
    tags:
      - "omnidriver-v*"
      - "omnidriver-openfoam-v*"
      - "omnidriver-cardiacfoam-v*"

jobs:
  build-and-release:
    name: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve package and version from tag
        id: pkg
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PKG="${TAG%-v*}"
          VERSION="${TAG##*-v}"
          echo "name=$PKG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag version matches pyproject.toml
        run: |
          DECLARED=$(python -c "import tomllib; print(tomllib.load(open('packages/${{ steps.pkg.outputs.name }}/pyproject.toml','rb'))['project']['version'])")
          if [ "$DECLARED" != "${{ steps.pkg.outputs.version }}" ]; then
            echo "Tag version ${{ steps.pkg.outputs.version }} does not match pyproject.toml version $DECLARED for ${{ steps.pkg.outputs.name }}"
            exit 1
          fi

      - name: Install build backend
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build packages/${{ steps.pkg.outputs.name }}

      - name: Create GitHub release with build artifacts
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ steps.pkg.outputs.name }} v${{ steps.pkg.outputs.version }}"
          files: packages/${{ steps.pkg.outputs.name }}/dist/*
          generate_release_notes: true
