[project]
name = "omnidriver-workspace"
version = "0.1.0"
description = "Monorepo workspace root. Install individual packages: pip install -e packages/omnidriver -e packages/omnidriver-openfoam -e packages/omnidriver-cardiacfoam -e packages/omnidriver-cardiaccore"
requires-python = ">=3.11"

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring a real cardiacFoam binary (skipped by default in CI)",
    # Duplicated in packages/omnidriver/pyproject.toml on purpose: a whole-repo
    # run (`pytest packages/`) resolves its config here, a per-package run
    # (`pytest packages/omnidriver/tests`, what CI's test-core job does)
    # resolves it there. A marker registered in only one place warns in the
    # other, and an unregistered marker is one typo away from silently
    # selecting nothing.
    "slow: builds a wheel in a throwaway venv; minutes, not seconds",
    # Needs the real native cardiacFOAM tutorials tree, supplied ONLY via
    # OMNIDRIVER_NATIVE_TUTORIALS (never discovered -- CLAUDE.md's "supplied
    # versus discovered" rule). Unlike `slow`, a native-marked test FAILS,
    # rather than skips, when that variable is unset: the point is to catch
    # a run that meant to exercise the real tree but forgot to supply it, not
    # to quietly pass over it. Deselect explicitly with -m "not native".
    # openCARP's native tests need OMNIDRIVER_OPENCARP_TUTORIALS instead (its
    # own tutorials tree and the real binary), under the same rule.
    "native: needs OMNIDRIVER_NATIVE_TUTORIALS or OMNIDRIVER_OPENCARP_TUTORIALS; fails (not skips) if unset",
]
addopts = "--import-mode=importlib"
pythonpath = [
    # Every package whose tests import a uniquely-named helper module from its
    # own `tests/` root must be listed here. Each package's own pyproject sets
    # `pythonpath = ["tests"]`, but that only applies when *that* package is the
    # rootdir; a whole-repo run resolves its config here and would otherwise not
    # find, say, `openfoam_assertions`. Added 2026-09-18 when integrating
    # core/adapter-boundaries, which relocated OpenFOAM-dependent tests into
    # packages/omnidriver-openfoam/tests/core/ alongside such a helper.
    "packages/omnidriver/tests",
    "packages/omnidriver-openfoam/tests",
    "packages/omnidriver-cardiacfoam/tests",
    "packages/omnidriver-cardiaccore/tests",
    "packages/omnidriver-opencarp/tests",
]
