[project]
name = "omnidriver-workspace"
version = "0.1.0"
description = "Monorepo workspace root. Install individual packages: pip install -e packages/omnidriver -e packages/omnidriver-openfoam -e packages/omnidriver-cardiacfoam"
requires-python = ">=3.11"

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring a real cardiacFoam binary (skipped by default in CI)",
]
addopts = "--import-mode=importlib"
pythonpath = [
    "packages/omnidriver/tests",
    "packages/omnidriver-openfoam/tests",
    "packages/omnidriver-cardiacfoam/tests",
]
